name: Source and CPU runtime checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight build tools
        run: python -m pip install "setuptools>=68" wheel
      - name: Test commands and built distribution
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q flow_planner data_process.py print_result.py setup.py tests
      - name: Check shell syntax
        run: |
          bash -n data_process.sh
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find flow_planner/run_script -name '*.sh' -print0)

  cpu-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MPLCONFIGDIR: /tmp/grid-matplotlib
      NUPLAN_DATA_ROOT: /tmp/nuplan-data
      NUPLAN_EXP_ROOT: /tmp/nuplan-output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU runtime and pinned nuPlan source
        run: |
          python -m pip install "setuptools>=68,<82" wheel
          python -m pip install torch==2.3.0 torchvision==0.18.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-nuplan.txt
          git clone https://github.com/motional/nuplan-devkit.git /tmp/nuplan-devkit
          git -C /tmp/nuplan-devkit checkout e9241677997dd86bfc0bcd44817ab04fe631405b
          python -m pip install --no-deps --no-build-isolation -e /tmp/nuplan-devkit
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Import real preprocessing and simulation entrypoints
        run: |
          python -c "import tensorboard.default, flow_planner.data.data_process.data_processor, flow_planner.planner, nuplan.planning.script.run_simulation, nuplan.planning.script.run_nuboard"
      - name: Test model, training lifecycle, reporting, and packaging
        run: python -m unittest discover -s tests -v
