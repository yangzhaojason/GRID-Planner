_target_: flow_planner.core.flow_matching_core.FlowMatchingCore

device: ${device}

input_aug:
  _target_: flow_planner.data.augmentation.nuplan_augmentation.NuPlanAugment
  state_aug:
    _target_: flow_planner.data.augmentation.state_aug.StatePerturbation
    augment_prob: 0.5
  map_aug: null
  device: ${device}

ego_planning_loss: 1.0
consistency_loss: 0.5

# Graph-aware weighting for semantic alignment (Sec. 3.4 style).
# Set enabled: true to turn it on; defaults are conservative.
graph_weighting:
  enabled: false          # keep training behavior identical by default
  alpha1: 0.1             # weight for structural centrality term Cent(tau)
  alpha2: 1.0             # weight for collision proxy CollProb(tau)
  cent_radius: 30.0       # [m] radius to count nearby agents for centrality
  cent_sigma: 15.0        # [m] RBF kernel sigma for agent-agent graph edge weights
  collision_radius: 8.0   # [m] distance threshold for high collision risk
  ttc_scale: 3.0          # [s] risk scale for TTC->prob mapping: exp(-TTC/ttc_scale)
  lane_radius: 30.0       # [m] radius for lane complexity proxy
  static_radius: 20.0     # [m] radius for static object complexity proxy
  beta_lane: 0.25         # coefficient for log1p(#near_lanes)
  beta_static: 0.15       # coefficient for log1p(#near_static_objects)
  beta_red: 0.25          # coefficient for log1p(#red_lane_points)
  temperature: 1.0        # soft temperature on log-weights
  enable_clipping: true
  normalize_by_mean: true # normalize w so that mean weight is ~1
  max_weight: 10.0
  min_weight: 0.1

# Relational Reward Surrogate (RRS) as a differentiable COST, optionally combined with w_GAIW.
# Default disabled to keep backward compatibility.
rrs:
  enabled: false
  nu: 0.0                # added to total loss: total += nu * mean(w * rrs_penalty)
  weight: 0.0            # alias for nu (kept for compatibility)
  nu_warmup_epochs: 0    # ramp nu from 0->nu over this many epochs (0 disables)
  use_gaiw: true
  dt: 0.1
  # safety
  safety_neighbor_source: past_cv
  d_safe: 2.0
  ttc_safe: 2.0
  ego_radius: 1.2
  neighbor_radius_scale: 0.5
  tau_softmin: 1.0
  s_barrier: 0.5
  # rule
  lane_dev_thr: 1.0
  red_stop_thr: 2.0
  spd_ratio_thr: 0.0
  dir_diff_thr: 0.8
  progress_target: 5.0
  min_mean_speed: 0.5
  # comfort
  w_acc: 0.1
  w_jerk: 0.05
  w_yaw_rate: 0.02
  # lambdas
  lam_col: 1.0
  lam_d: 1.0
  lam_ttc: 1.0
  lam_lane: 1.0
  lam_red: 0.5
  lam_spd: 0.5
  lam_dir: 0.0
  lam_comfort: 1.0
  lam_progress: 0.5
  lam_low_speed: 0.2

# On-policy RL using rollout rewards from RRS.
# Default algorithm is critic-free GRPO-style; actor_critic remains available as a fallback.
# Disabled by default to preserve existing training behavior.
rl:
  enabled: false
  algorithm: grpo
  use_gaiw: true
  reward_source: rollout
  rollout_use_cfg: true
  rollout_cfg_weight: 1.0
  rollout_seed_base: 3402
  group_size: 4
  group_center: true
  group_normalize: true
  group_norm_eps: 1.0e-6
  select_best_only: true
  improvement_aware: true
  reference_source: rollout
  reference_seed_offset: 1000
  improvement_margin: 0.0
  improvement_normalize_by_mean: true
  improvement_max_multiplier: 3.0
  auto_shrink_on_low_improvement: true
  auto_shrink_min_improvement: 0.002
  auto_shrink_min_active_frac: 0.10
  weight: 1.0
  critic_weight: 1.0
  warmup_epochs: 1
  critic_warmup_epochs: 1
  normalize_reward: false
  reward_scale: 1.0
  reward_clip: 10.0
  normalize_adv: true
  adv_clip: 5.0
  actor_use_negative_adv: false
  positive_only_adv: true
  normalize_fm_energy: true
  fm_energy_min_denom: 1.0e-6
  critic_loss: huber
  critic_huber_beta: 1.0
  hidden_dim: 128
  depth: 2
  dropout: 0.0